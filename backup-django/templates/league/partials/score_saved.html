<div id="score-form" class="rounded-xl border border-court-100 bg-white p-5 text-center">
  <p class="font-display text-2xl">{{ result.away_score }}–{{ result.home_score }}</p>
  <p class="mt-2 text-sm text-court-500">Score saved. Game marked final.</p>
  <a href="{% url 'game_detail' game.pk %}"
     class="mt-4 inline-block rounded-lg bg-court-700 px-4 py-3 text-sm font-semibold text-white">
    Back to game
  </a>
  <a href="{% url 'standings' %}" class="mt-3 block text-sm text-orange-ball">View standings</a>
</div>
